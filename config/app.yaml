# 应用基础信息

# 应用名称
name: DeepShell
# 应用版本  
version: "1.0.0"
# 应用描述
description: |
  DeepShell是基于大语言模型（LLM）的操作系统智能体，将LLM与操作系统深度集成，LLM作为操作系统的大脑，
  用户通过自然语言与操作系统完成交互，LLM分析用户的复杂需求、完成推理、决策、调用操作系统上的工具完成复杂任务。


# logo 相对根目录的路径
logo: "ui/icon/DeepShell/shell.png"

# 正常 GUI 启用全部工具；有副作用的操作仍需逐次批准。
agent:
  # react_text：旧版 Prompt Action；native_fc：直接调用兼容 API tools/tool_calls。
  tool_call_mode: native_fc
  # GUI 默认使用原生 FC；SDK 自带重试关闭，由应用记录每次尝试。
  native_fc_network:
    request_timeout: 20.0
    task_budget: 90.0
    max_retries: 1
    backoff_base: 0.5
  all_tools_enabled: true
  # 额外的工作区 create_text_file；原有工具由 all_tools_enabled 控制。
  approved_write_enabled: true
  workspace: "agent_workspace"
  trace_enabled: true
  trace_directory: "logs/agent_traces"
